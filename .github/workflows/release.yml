name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: ./scripts/package.sh --universal
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/Tsuta-*-macos.zip --generate-notes --title "Tsuta ${GITHUB_REF_NAME#v}"
